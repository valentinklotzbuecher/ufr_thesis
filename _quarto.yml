project:
  type: book

book:
  title: "Title of Your Thesis"
  subtitle: "An optional subtitle"
  author:
    - name: "Firstname Lastname"
      affiliations:
        - name: "University of Freiburg"
          department: "Department of Economics"
  # Set a fixed submission date once you hand in, e.g. 2026-10-15
  date: last-modified
  date-format: long
  chapters:
    - index.qmd
    - intro.qmd
    - conclusion.qmd
    - references.qmd
  # Quarto adds the .pdf extension
  output-file: "FirstnameLastname_thesis"

# Title page lines, printed as written; delete any you don't need
thesis-type: "Master's thesis"
degree: "Master of Science in Economics"
supervisor:
  - "Supervisor: Prof. Dr. Firstname Lastname"

bibliography: references.bib

format:
  html:
    theme: journal
    fontsize: 1.2em
    linestretch: 1.7
  pdf:
    documentclass: scrreprt
    papersize: a4
    fontsize: 12pt
    toc: true
    toc-depth: 3
    toc-title: "Table of contents"
    lof: false
    lot: false
    number-sections: true
    number-depth: 2
    geometry:
      - inner=6cm
      - outer=1cm
      - top=1.5cm
      - bottom=1cm
      - headsep=22pt
      - headheight=11pt
      - footskip=33pt
      - ignorehead
      - ignorefoot
      - heightrounded
    mainfont: "Times New Roman"
    sansfont: "Arial"
    monofont: "Courier New"
    include-in-header: include-in-header.tex
    template-partials:
        - before-body.tex

execute:
  cache: true
  freeze: auto
